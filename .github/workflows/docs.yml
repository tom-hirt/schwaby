# The documentation, built with warnings as errors, on every push and pull
# request: a docs-only change runs this and no test matrix (python.yml).
name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Pinned Python ${{ matrix.python }}
      id: pin
      shell: bash
      run: |
        version=$(tr -d '\r' < .python-versions | grep -E "^${MINOR//./\\.}\.[0-9]+$") || {
          echo "no pin for $MINOR in .python-versions"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
      env:
        MINOR: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3: setup-uv publishes no floating major tag
      with:
        version: "0.13.4"
        python-version: ${{ steps.pin.outputs.version }}
        activate-environment: true
    - name: The interpreter is the pinned build
      shell: bash
      run: >-
        python -c "import platform, sys; v = platform.python_version();
        sys.exit(0 if v == sys.argv[1] else 'running %s, pinned %s' % (v, sys.argv[1]))"
        ${{ steps.pin.outputs.version }}

    # The lock as a constraint pins whatever docs/requirements.txt installs
    # without adding anything to it, so that file still checks the imports
    # sphinx needs.
    - name: Install dependencies
      run: uv pip install -c requirements.lock -r docs/requirements.txt

    - name: Verify that documentation builds
      run: |
        sphinx-build -W docs/ docs-build
