name: tests

# CI runs when code it tests changes. A push or pull request touching only
# docs/ or Markdown runs no test matrix; docs.yml builds the docs on every
# one. A tag's push is never filtered by path, so a release always runs it.
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  # Lets CI be re-run on demand, without pushing an empty commit to provoke it.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every Python on every platform is fifteen jobs, and GitHub bills
        # Windows at twice the Linux rate and macOS at ten times it -- so a
        # single push costs about thirteen times what testing on Linux alone
        # does. That is hard to justify for every commit.
        #
        # Linux on every push, all three platforms on pull requests, on tags,
        # on a push to a release branch, and on a manual run. The
        # cross-platform risk in this library is concentrated in the token
        # file writer, which renames files and sets permissions; that is worth
        # proving before a merge or a release, not before every commit. A
        # release branch holds only the release's own commits, so each push
        # to one is a commit that may be tagged.
        #
        # workflow_dispatch is in the full-matrix list deliberately. Without it
        # the on-demand run would be Linux-only, so the one button available
        # for checking a cross-platform fix could not check one, and the only
        # way to test such a fix would be to cut a release.
        platform: >-
          ${{
            (github.event_name == 'pull_request'
             || github.event_name == 'workflow_dispatch'
             || startsWith(github.ref, 'refs/tags/')
             || startsWith(github.ref, 'refs/heads/release/'))
            && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Windows and macOS on the oldest and newest Python only: their risk
        # is the token file writer's renames and permissions, which do not
        # differ between the Pythons in the middle, and macOS bills at ten
        # times the Linux rate. Linux runs all five.
        exclude:
          - {platform: windows-latest, python: "3.11"}
          - {platform: windows-latest, python: "3.12"}
          - {platform: windows-latest, python: "3.13"}
          - {platform: macos-latest, python: "3.11"}
          - {platform: macos-latest, python: "3.12"}
          - {platform: macos-latest, python: "3.13"}
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    # The exact build .python-versions pins for this minor version, which
    # uv downloads and checks the hash of: the build every machine that
    # runs this suite runs. A minor version with no pin fails here, by name.
    - name: Pinned Python ${{ matrix.python }}
      id: pin
      shell: bash
      run: |
        version=$(tr -d '\r' < .python-versions | grep -E "^${MINOR//./\\.}\.[0-9]+$") || {
          echo "no pin for $MINOR in .python-versions"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
      env:
        MINOR: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3: setup-uv publishes no floating major tag
      with:
        version: "0.13.4"
        python-version: ${{ steps.pin.outputs.version }}
        activate-environment: true
    - name: The interpreter is the pinned build
      shell: bash
      run: >-
        python -c "import platform, sys; v = platform.python_version();
        sys.exit(0 if v == sys.argv[1] else 'running %s, pinned %s' % (v, sys.argv[1]))"
        ${{ steps.pin.outputs.version }}

    # With requirements.lock as a constraint, so every job tests the versions
    # every other machine tests. Without it each run would resolve afresh, and
    # a release appearing between two runs would change what is under test.
    - name: Install dependencies
      run: uv pip install -c requirements.lock ".[dev]"

    - name: Test
      run: coverage run --rcfile=setup.cfg --source=schwaby -p -m pytest tests/

    - name: Report coverage
      if: matrix.python == '3.10'
      run: |
        coverage combine
        # The reports are generated before the gate, and with the floor
        # disabled, so that a run which fails `fail_under` still produces the
        # report showing which lines caused it. Generated after `coverage
        # report`, they would not exist on exactly the run you need them for.
        coverage html --fail-under=0
        coverage xml --fail-under=0
        # This one is the gate: `fail_under` lives in setup.cfg.
        coverage report

    # `htmlcov/` is the useful half of coverage -- which lines never ran,
    # rather than a percentage -- so it is kept rather than discarded.
    - name: Keep the coverage report
      if: ${{ !cancelled() && matrix.python == '3.10' }}
      uses: actions/upload-artifact@v7
      with:
        # The 3.10 job runs on all three platforms when the matrix is full,
        # and upload-artifact refuses two artifacts with the same name.
        name: coverage-${{ matrix.platform }}
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14
        # A failed test run skips the step above, so there is nothing to
        # collect. That build is already red for a better reason; a warning
        # about a missing artifact on top of it is noise.
        if-no-files-found: ignore

    - name: Check twine
      if: matrix.python == '3.10'
      run: |
        # `setup.py sdist bdist_wheel` is deprecated -- setuptools calls the
        # deprecation "overdue". `python -m build` is what publish.yml uses, so
        # this checks the artifact that actually ships.
        uv pip install -c requirements.lock build "readme_renderer[md]"
        python -m build
        # --strict, and readme_renderer[md] above: without that extra, twine
        # reports PASSED on a markdown long_description having rendered
        # nothing at all.
        twine check --strict dist/*
