version: 2

updates:
  # Without this nothing in the repository watches the actions CI uses, and
  # one falling major versions behind surfaces only as a deprecation warning
  # buried in a job annotation.
  #
  # Monthly rather than weekly: these move slowly and a pull request nobody
  # reads is worse than no pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

# Deliberately not watching the Python dependencies. This library places
# trades, its own requirements are floors rather than pins, and a bot opening
# pull requests against authlib or httpx would either be ignored or merged
# without the live verification those changes actually need. Upgrading them is
# a decision, not a chore.
