[metadata]
license_files = LICENSE

[tool:pytest]
python_files = *test*.py
testpaths = tests
norecursedirs=schwaby build dist docs htmlcov

# Every test has a limit, and one that passes it fails by name instead of
# hanging the run. The whole suite takes about 15 seconds in one process, so a
# minute for one test is generous. The case it exists for: a login-flow test
# whose callback server never answers waits out the flow's five-minute
# callback timeout, and without a limit that reads as a slow run rather than
# a failure.
timeout = 60

# A helper named `test_*` is collected by pytest, called, and passes -- a test
# that tests nothing, which is the worst kind because it reports green and
# raises the count. unittest already warns when a collected test returns a
# value; this makes that warning fail the run, which is the only way anyone
# reads it.
filterwarnings =
    error:It is deprecated to return a value that is not None from a test case

[coverage:run]
branch = True

[coverage:report]
# Two decimal places, because the floor below is compared against whatever this
# prints. At the default precision everything from 96.5 to 97.4 displays as
# `97`, so a floor of 97 is really a floor of 96.5 and the number in this file
# would not mean what it says.
precision = 2

# A floor, not a target. This project's own record is that coverage does not
# find its defects -- every one found so far was in code with 100% line
# coverage -- so the number is not evidence of anything and chasing it is a
# waste. What it does catch, and nothing else here does, is a body of new code
# arriving with no tests at all.
#
# Chosen by measuring rather than by rounding, and re-measured whenever the
# figure moves -- a calibration comment that no longer describes the tree
# sends the next person recalibrating from a wrong baseline.
#
# Measured at 5.5.0, on CI's 3.10 legs: Linux 97.78%, macOS 97.56%, Windows
# 96.87%. Windows is lowest because it cannot run the POSIX-only half of the
# shared token file's lock (fcntl, and the owner and mode checks), and the
# tests of it skip there. Each untested statement added costs about 0.016
# points.
#
# So 96.0 leaves room for roughly 115 untested statements on Linux, 100 on
# macOS and 60 on Windows. That is deliberately loose: the floor is here to
# catch a body of new code arriving with no tests, not to ratchet upward
# every time coverage improves, and a floor that tracks the current number
# turns every ordinary change into a negotiation with this file. Lower it
# only by re-measuring, as here, and raise it when it stops catching that.
fail_under = 96.0

# Keep this list to lines that actually occur in schwaby/. A pattern that
# matches nothing today still matches whatever is written later: `except
# ImportError` here would silently drop any future ImportError handler out of
# coverage.
exclude_lines =
    pragma: no cover
    raise NotImplementedError
